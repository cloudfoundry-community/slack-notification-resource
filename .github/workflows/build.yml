name: Build and publish resource image

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/bguttmannavtq/slack-notification-resource

jobs:
  test:
    name: Test linux/${{ matrix.architecture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tests
          platforms: linux/${{ matrix.architecture }}
          build-args: alpine=alpine:edge
          pull: true
          load: true
          tags: slack-notification-resource:test-${{ matrix.architecture }}
      - name: Test resource entrypoints
        run: |
          printf '{}' | docker run --rm -i slack-notification-resource:test-${{ matrix.architecture }} /opt/resource/check | jq -e '. == []'
          printf '{}' | docker run --rm -i slack-notification-resource:test-${{ matrix.architecture }} /opt/resource/in | jq -e '. == {version: {timestamp: "none"}}'

  scan:
    name: Scan image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          target: resource
          platforms: linux/amd64
          build-args: alpine=alpine:edge
          pull: true
          load: true
          tags: slack-notification-resource:scan
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: slack-notification-resource:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish image
    if: >-
      github.repository == 'benjaminguttmann-avtq/slack-notification-resource' &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    needs: [test, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bguttmannavtq
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: resource
          platforms: linux/amd64,linux/arm64
          build-args: alpine=alpine:edge
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}